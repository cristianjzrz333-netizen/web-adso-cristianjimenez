  <!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario de inscripción SENA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link
    href="https://fonts.googleapis.com/css2?family=Isometra&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Formulario de inscripción SENA</h1>

    <form class="formInscripcion" id="formInscripcion">
      <fieldset>
        <legend>Datos personales</legend>


        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre..." required minlength="3">
          <small id="error-nombre" class="error"></small>
        </div>

        <div class="campo">
          <label for="documento">Documento</label>
          <input type="text" inputmode="numeric" id="documento" name="documento" placeholder="Ej. 1234567890" required
            pattern="[0-9]{6,10}" title="entre 6-10 caracteres">
          <small id="error-documento" class="error"></small>
        </div>

        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="Ej.tunombre@gmail.com" required>
          <small id="error-correo" class="error"></small>
        </div>

        <div class="campo">
          <label for="telefono">Celular</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej. 3105807564" required pattern="3[0-9]{9}"
            title="comienza en 3 y exactamente 10 dígitos">
          <small id="error-telefono" class="error"></small>
        </div>


      </fieldset>

      <fieldset>
        <legend>Cursos</legend>
        <div class="campo">
          <label for="programa">Programa</label>
          <select name="programa" id="programa" required>
            <option value="">Seleccione un programa</option>
            <option value="software">Desarrollo de Sistemas</option>
            <option value="redes">Gestión de redes</option>
            <option value="multimedia">Producción Multimedia</option>
          </select>

          <small id="error-programa" class="error"></small>
        </div>

        <fieldset class="grupo">

          <legend>Jornada</legend>
      
          <label class="opcion">
            <input type="radio" name="jornada" value="mañana" required>Mañana</label>

          <label class="opcion">
            <input type="radio" name="jornada" value="tarde">Tarde</label>

          <label class="opcion">
            <input type="radio" name="jornada" value="noche">Noche</label>

          <small id="error-jornada" class="error"></small>

          </fieldset>

          <fieldset class="grupo"> 
            
            <legend>Autorización de datos</legend>
            
            <p>Autorizo el tratamiento de mis datos personales
              para los fines relacionados con mi inscripción
              y los procesos de formación.</p>

            <label class="autorizacion">
              <input type="checkbox" id="autorizacion" name="terminos" value="acepto" required>Acepto el tratamientio de mis datos personales
            </label>

            <small id="error-autorizacion" class="error"></small>
            
          </fieldset>
            
        </fieldset>

        <button type="sumbit" class="boton">Inscribirse</button>

    </form>

    <section id="resumen"></section>
    
  </main>
</body>
</html>
