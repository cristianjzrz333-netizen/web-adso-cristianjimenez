<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Registro a la biblioteca</h1>
      <form class="formulario">
        <fieldset>
          <legend>Tus datos</legend>

          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required minlength="4">
          </div>

          <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" />
          </div>

          <div class="campo">
            <label for="nacimiento">Fecha de nacimiento</label>
            <input type="date" id="nacimiento" name="nacimiento" />
          </div>

          <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave"  pattern="[a-z]{7}" />
          </div>
        </fieldset>

        <fieldset>
          <legend>Tu perfil</legend>

          <div class="campo">
            <label for="tipo">Tipo de usuario</label>
            <select id="tipo" name="tipo" required>
              <option value="">Elige una opción</option>
              <option value="aprendiz">Aprendiz</option>
              <option value="instructor">Instructor</option>
              <option value="visitante">Visitante</option>
            </select>
          </div>

          <fieldset class="grupo">
            <legend>Sede</legend>
            <label class="opcion"
              ><input type="radio" name="sede" value="norte" /> Norte</label
            >
            <label class="opcion"
              ><input type="radio" name="sede" value="centro" /> Centro</label
            >
            <label class="opcion"
              ><input type="radio" name="sede" value="sur" /> Sur</label
            >
          </fieldset>

          <fieldset class="grupo">
            <legend>Temas que te interesan</legend>
            <label class="opcion"
              ><input type="checkbox" name="temas" value="novelas" />
              Novelas</label
            >
            <label class="opcion"
              ><input type="checkbox" name="temas" value="ciencia" />
              Ciencia</label
            >
            <label class="opcion"
              ><input type="checkbox" name="temas" value="tecnologia" />
              Tecnología</label
            >
          </fieldset>

          <div class="campo">
            <label for="comentario"
              >¿Qué libro te gustaría que tuviéramos?</label
            >
            <textarea id="comentario" name="comentario" rows="4"></textarea>
          </div>
        </fieldset>

        <button type="submit" class="boton">Registrarme</button>
      </form>
    </main>
  </body>
</html>
